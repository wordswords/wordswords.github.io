baseURL: "https://wordswords.github.io/"
title: DavidCraddock.net
copyright: "© David Paul Craddock"
theme: PaperMod-dpc

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: true
buildFuture: true
buildExpired: true
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

frontmatter:
  date:
  - date
  - :git
  - :fileModTime

minify:
  disableXML: true
  minifyOutput: true

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: HomeLab
          url: my-home-network/
          weight: 11
        - name: WFH Setup
          url: my-work-computer/
          weight: 13
        - name: WFA Setup
          url: my-mobile-laptop-setup/
          weight: 14
        - name: E-Biking
          url: my-bike/
          weight: 15
        - name: vWorkbench
          url: vworkbench/
          weight: 16
        - name: Writing
          url: my-writing/
          weight: 17
        - name: Cyber Security
          url: security-research/
          weight: 18
        - name: Gaming
          url: https://davidcraddock.games
          weight: 19
        - name: Media Collection
          url: https://home.davidcraddock.net
          weight: 20
        - name: DJing
          url: https://davidcraddockaudio.com
          weight: 21

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "DavidCraddock.net"
  author: David Craddock
  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  TocOpen: true # open contents automantically
  pagerSize: 5 # how many posts are listed per page in the list
  comments: true
  enableGitInfo: true
  images: ["/mugshot.png"]
  social:
    github: wordswords
    instagram: djdavidcraddock

  homeInfoParams:
    Content: >
      👋 Welcome to my personal <a href="https://gohugo.io/">blog</a>. This blog has information on the hobbyist technical projects, and other extra-cirricular 'life' activities that I've been getting up to. <br/><br/>
      If you need to contact me at any time, please <a href="mailto:3rp2mzocr@mozmail.com">use this email address</a>. Other facets of my online presence:<br/><br/>
      <ul>
        <li> 🎓 <a href="https://DavidCraddockTutor.com">DavidCraddockTutor.com</a></li>
        <li> 📖 <a href="https://DavidCraddockReads.com">DavidCraddockReads.com</a></li>
        <li> 🎮 <a href="https://DavidCraddock.Games">DavidCraddock.Games</a></li>
        <li> 🎵 <a href="https://DavidCraddockAudio.com">DavidCraddockAudio.com</a></li>
        <li> 🤸 <a href="https://DJDavidCraddock.com">DJDavidCraddock.com</a></li>
      </ul>
      <br/>
      <img loading="lazy" style="object-fit:contain;max-width:100%;max-height:100%;width:127px;height:127px;" src="/mugshot.png" alt="A mugshot of me">

assets:
  disableHLJS: true
  disableFingerprinting: true

cover:
  hidden: false
  hiddenInList: false
  hiddenInSingle: false
  linkFullImages: true

markup:
  goldmark:
    backend: html5
    failureLevel: fatal
    noHeaderOrFooter: true
    preserveTOC: true
    sectionNumbers: false
    trace: false
    verbose: false
    workingFolderCurrent: false
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

highlight:
    noClasses: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

services:
  instagram:
    disableInlineCSS: true
  twitter:
    disableInlineCSS: true
