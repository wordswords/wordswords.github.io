baseURL: "https://wordswords.github.io/"
title: DavidCraddock.net
copyright: "© David Paul Craddock"
theme: PaperMod-dpc

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: true
buildFuture: true
buildExpired: true
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

frontmatter:
  date:
  - date
  - :git
  - :fileModTime

minify:
  disableXML: true
  minifyOutput: true

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: HomeLab
          url: my-home-network/
          weight: 11
        - name: WFH Setup
          url: my-work-computer/
          weight: 13
        - name: WFA Setup
          url: my-mobile-laptop-setup/
          weight: 14
        - name: E-Biking
          url: my-bike/
          weight: 15
        - name: vWorkbench
          url: vworkbench/
          weight: 16
        - name: Writing
          url: my-writing/
          weight: 17
        - name: Cyber Security
          url: security-research/
          weight: 18
        - name: AI/ML
          url: aiml/
          weight: 19
        - name: Gaming
          url: https://davidcraddock.games
          weight: 20
        - name: Reading
          url: https://davidcraddockreads.com
          weight: 21
        - name: Freelance Work
          url: https://davidcraddocktutor.com
          weight: 22
        - name: RSS Feed
          url: https://davidcraddock.net/index.xml
          weight: 23
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, x-cards and schema.
  description: "DavidCraddock.net"
  author: David Craddock
  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  TocOpen: true # open contents automantically
  pagerSize: 5 # how many posts are listed per page in the list
  comments: true
  enableGitInfo: true
  images: ["/mugshot.png"]
  social:
    github: wordswords
    instagram: djdavidcraddock

  homeInfoParams:
    Content: >
      👋 Welcome to my personal <a href="https://gohugo.io/">blog</a>. This blog has information on the hobbyist technical projects, and other 'side-quests', that I've been getting up to. It is mostly esoteric rambling, but I mostly put these things up there in the hope that they will help someone, and to improve my writing skills. I'd also be lying if I said I wasn't proud of some of what I've achieved in these areas :) <br/><br/>
      If you need to contact me at any time, please <a href="mailto:3rp2mzocr@mozmail.com">use this email address</a>. Other facets of my online presence:<br/><br/>
      <ul>
        <li> 🎮 <a href="https://DavidCraddock.Games">DavidCraddock.Games - My Gaming Blog</a></li>
        <li> 📖 <a href="https://DavidCraddockReads.com">DavidCraddockReads.com - My Books and Comics Blog</a></li>
        <li> 🧑 <a href="https://DavidCraddockTutor.com">DavidCraddockTutor.com - My Tutoring and Freelance Portfolio</a></li>
        <li> ⚫ <a href="https://DavidCraddockAudio.com">DavidCraddockAudio.com - My Audio/DJing/Music Work Portfolio</a></li>
        <li> * <a href="https://defcon.social/@wordswords">My Mastodon account at: defcon.social/@wordswords</a></li>
        <li> * <a href="https://github.com/wordswords/dpc-resume/blob/master/CV.pdf">My CV/Resume</a></li>
        <li> * <a href="https://github.com/wordswords">My Github (wordswords)</a></li>
        <li> * <a href="https://cybersec-soc-ulgc.github.io/">University of London Cyber Security Society (which I help out with)</a></li>
        <li> * <a href="https://straylightresearch.ai/">Straylight Research Ltd - My own company, working on projects in the intersection between software engineering, Cyber Security and AI/ML</a></li>
      </ul>
      <br/>
      <img loading="lazy" style="object-fit:contain;max-width:100%;max-height:100%;width:127px;height:127px;" src="/mugshot.png" alt="A mugshot of me">

assets:
  disableHLJS: true
  disableFingerprinting: true

cover:
  hidden: false
  hiddenInList: false
  hiddenInSingle: false
  linkFullImages: true

markup:
  goldmark:
    backend: html5
    failureLevel: fatal
    noHeaderOrFooter: true
    preserveTOC: true
    sectionNumbers: false
    trace: false
    verbose: false
    workingFolderCurrent: false
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

highlight:
    noClasses: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
  disqus:
    shortname: davidcraddocknet

